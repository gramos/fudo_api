openapi: 3.0.3
info:
  title: Fudo API
  version: 1.0.0
paths:
  /auth:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Invalid JSON
        '401':
          description: Invalid credentials
  /products:
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '202':
          description: Product creation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingProduct'
        '400':
          description: Invalid product data
        '401':
          description: Unauthorized
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Credentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Token:
      type: object
      required:
        - token
        - token_type
      properties:
        token:
          type: string
        token_type:
          type: string
          example: Bearer
    ProductInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Product:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PendingProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              example: pending
